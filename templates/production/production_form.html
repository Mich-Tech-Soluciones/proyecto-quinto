{% extends "base.html" %}

{% block page_title %}Nuevo Proceso de Producción{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="text-muted">Añadir nuevo proceso</div>
    <a href="{% url 'production_list' %}" class="btn btn-outline-secondary rounded-pill border-secondary text-white">
        <i class="bi bi-arrow-left"></i> Volver al listado
    </a>
</div>

<div class="glass-card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label text-muted small">Producto a Producir</label>
            {{ form.product }}
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small">Cantidad</label>
                {{ form.quantity }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small">Estado Inicial</label>
                {{ form.status }}
            </div>
        </div>

        <div class="mt-4 text-end">
            <button type="submit" class="btn btn-atrium px-4">Iniciar Proceso</button>
        </div>
    </form>
</div>
{% endblock %}
