{% extends "base.html" %}

{% block page_title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="text-muted">Añadir producto al inventario</div>
    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary rounded-pill border-secondary text-white">
        <i class="bi bi-arrow-left"></i> Volver al listado
    </a>
</div>

<div class="glass-card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label text-muted small">Nombre del Producto</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label text-muted small">Descripción</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small">Precio ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small">Stock Inicial</label>
                <input type="number" name="stock" class="form-control" value="0" required>
            </div>
        </div>

        <div class="mt-4 text-end">
            <button type="submit" class="btn btn-atrium px-4">Guardar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
