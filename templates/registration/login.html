{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KAZA ERP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Admin CSS -->
    <link href="{% static 'css/admin.css' %}" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
        .login-box .form-control {
            padding: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box glass-card fade-in">
        <h2 class="fw-bold mb-4" style="color: var(--kaza-cream); letter-spacing: 3px;">KAZA ERP</h2>
        <p class="text-muted mb-4">Ingresa tus credenciales para continuar</p>
        
        {% if form.errors %}
            <div class="alert border-danger bg-danger bg-opacity-10 text-danger small p-2 mb-4">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group text-start">
                <label for="id_username" class="text-muted small ms-1 mb-1">Usuario</label>
                <input type="text" name="username" class="form-control" autofocus required id="id_username" placeholder="Nombre de usuario">
            </div>
            <div class="form-group text-start">
                <label for="id_password" class="text-muted small ms-1 mb-1">Contraseña</label>
                <input type="password" name="password" class="form-control" required id="id_password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-atrium w-100 mt-3 py-2 fs-5">Ingresar</button>
        </form>
    </div>
</body>
</html>
